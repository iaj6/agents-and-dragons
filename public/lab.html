<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Lab · Agents &amp; Dragons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #14100c; --night-2: #1d1712; --night-3: #2a2119; --line: #3b2f24;
      --text: #eadcc2; --muted: #a18d74; --dim: #7c6d5a; --candle: #e8a33d;
      /* model colours: reference categorical slots 1-4, dark steps, validated against --night-2 */
      --m-opus: #3987e5; --m-sonnet: #d95926; --m-haiku: #199e70; --m-other: #c98500;
      --bar: #8a7a64;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--text); font: 17px/1.5 "EB Garamond", Georgia, serif; }
    header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #17120d; position: sticky; top: 0; z-index: 5; }
    h1 { font: 700 22px "Cinzel", serif; color: var(--candle); margin: 0; letter-spacing: 0.05em; }
    header nav { margin-left: auto; display: flex; gap: 14px; font-size: 15px; }
    a { color: var(--candle); }
    select { background: var(--night-3); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: 15px "EB Garamond", serif; max-width: 320px; }
    main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
    .question { font: italic 22px/1.35 "EB Garamond", serif; margin: 6px 0 4px; }
    .meta { font: 13px "JetBrains Mono", monospace; color: var(--muted); }
    .badge { font: 600 11px "JetBrains Mono", monospace; background: #3a2a14; color: var(--candle); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 18px; }
    .card { background: var(--night-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
    .card h2 { font: 700 14px "Cinzel", serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
    .card .sub { font-size: 15px; color: var(--dim); margin: 0 0 12px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font: 12px "JetBrains Mono", monospace; color: var(--muted); margin-bottom: 10px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .stackrow { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; margin: 7px 0; }
    .stackrow .lab { font: 12.5px "JetBrains Mono", monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stackrow .lab small { color: var(--dim); }
    .stack { display: flex; gap: 2px; height: 20px; }
    .stack span { border-radius: 4px; min-width: 2px; position: relative; cursor: default; }
    .stack span b { position: absolute; left: 6px; top: 1px; font: 600 11px "JetBrains Mono", monospace; color: #fff; white-space: nowrap; }
    .stack.empty { background: repeating-linear-gradient(135deg, #2a2119 0 6px, transparent 6px 12px); border-radius: 4px; }
    .group-title { font: 12px "JetBrains Mono", monospace; color: var(--dim); margin: 12px 0 2px; text-transform: uppercase; letter-spacing: 0.08em; }
    table { width: 100%; border-collapse: collapse; font: 12.5px "JetBrains Mono", monospace; }
    th { text-align: left; font-weight: 400; color: var(--dim); padding: 4px 8px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 6px 8px 6px 0; border-bottom: 1px solid #2a221a; vertical-align: middle; color: var(--text); }
    td.v { min-width: 110px; }
    td:first-child { white-space: nowrap; padding-right: 12px; }
    td.wrap { white-space: normal; }
    .pill { display: inline-block; margin: 1px 10px 1px 0; white-space: nowrap; }
    .card { overflow-x: auto; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3b2f24; border-radius: 4px; }
    .cell { display: flex; align-items: center; gap: 8px; }
    .cell .num { min-width: 52px; }
    .cell .track { flex: 1; height: 6px; background: #2a221a; border-radius: 3px; min-width: 50px; max-width: 160px; }
    .cell .track i { display: block; height: 100%; border-radius: 3px; background: var(--bar); }
    .few { color: var(--dim); font-size: 11px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .evidence .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .evidence .chips button { font: 12px "JetBrains Mono", monospace; background: var(--night-3); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
    .evidence .chips button.on { color: var(--candle); border-color: var(--candle); }
    .ev { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid #2a221a; font-size: 15.5px; }
    .ev .k { font: 11px "JetBrains Mono", monospace; color: var(--candle); text-transform: uppercase; padding-top: 3px; }
    .ev .run { font: 11px "JetBrains Mono", monospace; color: var(--dim); }
    .ev a { font: 12px "JetBrains Mono", monospace; white-space: nowrap; }
    .evlist { max-height: 520px; overflow-y: auto; }
    .note { font-size: 15px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin-top: 12px; }
    #tip { position: fixed; pointer-events: none; background: #0e0b08; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: 12px "JetBrains Mono", monospace; color: var(--text); z-index: 10; display: none; max-width: 280px; }
    .empty-state { color: var(--muted); font-style: italic; padding: 40px 0; text-align: center; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .stackrow { grid-template-columns: 90px 1fr; } .ev { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>The Lab</h1>
    <select id="pick" aria-label="Experiment"></select>
    <nav id="sitenav"></nav>
  </header>
  <main id="main"><div class="empty-state">Loading…</div></main>
  <div id="tip"></div>
  <script src="nav.js"></script>
  <script src="lab.js"></script>
</body>
</html>
